spring:
  application:
    name: Assignment

  datasource:
    url: jdbc:postgresql://localhost:9012/postgre-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA should be a child of 'spring', not 'datasource'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis should also be a child of 'spring'
  data:
    redis:
      host: localhost
      port: 6378