services:
  postgresql:
    image: postgres:17-alpine
    container_name: postgres-Assignment
    environment:
      POSTGRES_DB: postgre-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "9012:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis-Assignment
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped



volumes:
  postgres-data:
  redis-data:
